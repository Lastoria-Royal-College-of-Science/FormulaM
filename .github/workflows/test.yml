name: Test and Build

on:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Whether to upload the built dist directory as a GitHub Pages artifact.
        required: false
        type: boolean
        default: false

  push:
    branches-ignore:
      - main

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - run: pnpm ci
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build

      - run: pnpm --filter @formulam/web exec playwright install --with-deps chromium
      - run: pnpm run e2e

      - uses: actions/configure-pages@v6
        if: ${{ inputs.upload-pages-artifact }}

      - uses: actions/upload-pages-artifact@v5
        if: ${{ inputs.upload-pages-artifact }}
        with:
          path: apps/web/dist
