<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FormulaM</title>
    <link rel="icon" href="%BASE_URL%favicon-light.svg" type="image/svg+xml" />
    <script>
      const initialTheme = window.matchMedia("(prefers-color-scheme: light)").matches
        ? "light"
        : "dark";
      document.documentElement.dataset.theme = initialTheme;

      const favicon = document.querySelector('link[rel="icon"]');
      if (favicon) {
        favicon.href = favicon.href.replace(
          /favicon-(?:dark|light)\.svg$/,
          `favicon-${initialTheme}.svg`,
        );
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
